# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
# How to use:
# 1. Copy this file to your project root as `tctfile` or `tctfile.yml`.
# 2. Edit the SESSION_ID, TIMEZONE, and API keys for your primary bot.
# 3. Uncomment additional bots (2 through 5) and edit their IDs/Prefixes if needed.
# 4. The YAML anchors (`*default_alive_images`, etc.) ensure you don't repeat
#    huge lists. To customize images/locks for a specific bot, just replace the
#    `*default_...` with your own list/map inside that bot's block.
# ==============================================================================
