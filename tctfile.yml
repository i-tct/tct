# ==============================================================================
# TCT FULL MULTI-TENANT CONFIGURATION FILE (tctfile)
# YAML Format | Supports up to 5 Bot Sessions
# ==============================================================================

# ------------------------------------------------------------------------------
# GLOBAL INSTANCE SETTINGS
# These apply to the entire application / all bots running on this server.
# ------------------------------------------------------------------------------

# --- Server & Deployment ---
# Port for the Web Dashboard / Internal API.
SERVER_PORT: 3003

# Optional: Path for IPC UNIX sockets (leave commented unless needed).
#UNIX_SOCKET_PATH: "/tmp/tct.sock"

# --- Global API & Network Overrides ---
# Set HTTP/HTTPS Proxy. Use "none" or "off" to explicitly disable. Leave commented
#HTTP_PROXY: "none"
#HTTPS_PROXY: "none"

# API Mode (production/testing). Test API URL is used when mode is "test".


# --- Global Logging (Applies to all bots) ---
# Filter out verbose debug noise from the console.
FILTER_NOISE_LOGS: true

# Log to a file. If false, logs only go to console.
LOG_TO_FILE: true

# Path to the log file.
LOG_FILE_PATH: "data/app.log"

# Logging level: "debug", "info", "warn", "error".
LOG_LEVEL: "info"

# ------------------------------------------------------------------------------
# DATABASE SETTINGS 
# ------------------------------------------------------------------------------
DATABASE:
  # SYNC_MODE: "OFF" (fastest, riskier), "NORMAL" (balanced), "FULL" (safest).
  SYNC_MODE: "NORMAL"
  
  # Number of operations to batch before flushing.
  BATCH_SIZE: 200
  
  # Flush interval (milliseconds, or duration string like "5s").
  FLUSH_INTERVAL: "5000"
  
  # Max memory for DB caching (default: 128MB).
  CACHE_MAX_BYTES: 134217728
  
  # Enable WAL for better concurrency.
  USE_WAL: true
  
  # Max wait time for a locked DB (ms).
  BUSY_TIMEOUT_MS: 15000

# ------------------------------------------------------------------------------
# CLOUDINARY (Shared Media Hosting Credentials)
# Uncomment and fill if your bot uploads media to Cloudinary.
# ------------------------------------------------------------------------------
#CLOUDINARY:
#  CLOUD_NAME: "your_cloud_name"
#  API_KEY: "your_api_key"
#  API_SECRET: "your_api_secret"

# ------------------------------------------------------------------------------
# POSTGRESQL BACKUP SYNC
# Optional: Sync your SQLite data to a remote PostgreSQL database.
# ------------------------------------------------------------------------------
#POSTGRES_URL: "postgresql://postgres.xxxxxxxxx:x0LO1DIxEY0HvDaX@aws-1-eu-west-1.pooler.supabase.com:5432/postgres"
POSTGRES_SYNC_INTERVAL: 60   # Time in seconds.

# ==============================================================================
# DEFAULT TEMPLATES (YAML Anchors)
# These define reusable defaults so you don't repeat yourself.
# Each bot inherits these unless you overwrite them inside its block.
# ==============================================================================

# ----- Default Alive Images -----
